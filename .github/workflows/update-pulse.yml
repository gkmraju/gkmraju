name: Refresh profile pulse

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_pulse.py"
      - ".github/workflows/update-pulse.yml"

permissions:
  contents: write

concurrency:
  group: profile-pulse
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh native Markdown stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_pulse.py

      - name: Commit refreshed pulse
        run: |
          if git diff --quiet -- README.md; then
            echo "Pulse is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "chore: refresh profile pulse"
          git push
